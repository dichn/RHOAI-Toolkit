---
# PGVector database for OGX memory layer (vector_io + responses persistence).
# The OGX base config (llama-stack-config) references PGVECTOR_* env vars
# which are injected via workload.overrides.env on the OGXServer.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: genai-pgvector-storage
  namespace: ${NAMESPACE}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: genai-pgvector-credentials
  namespace: ${NAMESPACE}
type: Opaque
stringData:
  password: "${PGVECTOR_PASSWORD}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-pgvector
  namespace: ${NAMESPACE}
  labels:
    app: genai-pgvector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genai-pgvector
  template:
    metadata:
      labels:
        app: genai-pgvector
    spec:
      containers:
      - name: pgvector
        image: registry.redhat.io/rhel9/postgresql-16:latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRESQL_USER
          value: vectoruser
        - name: POSTGRESQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: genai-pgvector-credentials
              key: password
        - name: POSTGRESQL_DATABASE
          value: vectordb
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/pgsql/data
        - name: init
          mountPath: /opt/app-root/src/postgresql-start
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: genai-pgvector-storage
      - name: init
        configMap:
          name: genai-pgvector-init
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-pgvector-init
  namespace: ${NAMESPACE}
data:
  enable-pgvector.sh: |
    #!/bin/bash
    psql -d vectordb -c "CREATE EXTENSION IF NOT EXISTS vector;"
---
apiVersion: v1
kind: Service
metadata:
  name: genai-pgvector
  namespace: ${NAMESPACE}
spec:
  selector:
    app: genai-pgvector
  ports:
  - port: 5432
    targetPort: 5432
---
# OGXServer — uses overrideConfig (not baseConfig) to completely bypass the
# operator's config generation. The llama-stack-config ConfigMap from the
# working Playground setup provides all provider definitions. Env vars for
# vLLM, pgvector, etc. are injected via workload.overrides.env.
#
# Key learnings (Oct 2026):
#   - distribution "rh-dev" works with overrideConfig; "rh" + baseConfig triggers
#     the operator's config merge which strips fields the Python runtime needs
#   - overrideConfig bypasses the operator entirely — the ConfigMap IS the config
#   - No providers in the CRD spec — everything comes from the ConfigMap
#   - VLLM_API_TOKEN must be non-empty (OGX crashes on empty env vars)
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: autorag-ogx
  namespace: ${NAMESPACE}
  annotations:
    openshift.io/display-name: AutoRAG OGX
  labels:
    opendatahub.io/dashboard: "true"
spec:
  distribution:
    name: rh-dev
  network:
    port: 8321
    externalAccess:
      enabled: true
  overrideConfig:
    key: config.yaml
    name: llama-stack-config
  workload:
    overrides:
      command:
      - /bin/sh
      - -c
      - ogx run /etc/ogx/config.yaml --insecure
      env:
      - name: VLLM_TLS_VERIFY
        value: "false"
      - name: FAISS_STORE_DIR
        value: ~/.llama/faiss
      - name: SENTENCE_TRANSFORMERS_HOME
        value: /opt/app-root/.cache/huggingface/hub
      - name: HF_HUB_OFFLINE
        value: "1"
      - name: TRANSFORMERS_OFFLINE
        value: "1"
      - name: HF_DATASETS_OFFLINE
        value: "1"
      - name: VLLM_MAX_TOKENS_1
        value: "4096"
      - name: VLLM_API_TOKEN_1
        value: "unused"
      - name: PGVECTOR_HOST
        value: "genai-pgvector.${NAMESPACE}.svc.cluster.local"
      - name: PGVECTOR_PORT
        value: "5432"
      - name: PGVECTOR_DB
        value: vectordb
      - name: PGVECTOR_USER
        value: vectoruser
      - name: PGVECTOR_PASSWORD
        valueFrom:
          secretKeyRef:
            key: password
            name: genai-pgvector-credentials
      - name: OGX_CONFIG_DIR
        value: /opt/app-root/src/.ogx/distributions/rh/
    replicas: 1
    resources:
      limits:
        cpu: "2"
        memory: 12Gi
      requests:
        cpu: 250m
        memory: 500Mi
